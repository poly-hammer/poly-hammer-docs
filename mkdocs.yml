site_name: Poly Hammer
site_description: Comprehensive documentation for Poly Hammer's tools and platform.
site_url: "https://docs.polyhammer.com"
site_dir: site
repo_url: "https://github.com/poly-hammer/poly-hammer-docs"

watch:
  - overrides

nav:
  - Home: index.md
  - Poly Hammer Portal:
    - Blender Extension Repo: poly-hammer-portal/blender-extension-repo.md
  - Poly Hammer Interchange:
    - Getting Started: poly-hammer-interchange/getting-started.md
  # BEGIN EXTERNAL DOCS
  - Character DNA Addon:
    - Getting Started: character-dna-addon/index.md
    - Terminology: character-dna-addon/terminology.md
    - FAQ: character-dna-addon/faq.md
    - Free Features:
      - Rig Instances: character-dna-addon/free-features/rig-instances.md
      - View Options: character-dna-addon/free-features/view-options.md
      - Face Board: character-dna-addon/free-features/face-board.md
      - Animation: character-dna-addon/free-features/animation.md
      - Output: character-dna-addon/free-features/output.md
    - Pro Features:
      - Converter: character-dna-addon/pro-features/converter.md
      - Raw Editor: character-dna-addon/pro-features/raw-editor.md
      - Shape Key Editor: character-dna-addon/pro-features/shape-key-editor.md
      - RBF Editor: character-dna-addon/pro-features/rbf-editor.md
      - Backup Manager: character-dna-addon/pro-features/backup-manager.md
    - Workflows:
      - Append & Link: character-dna-addon/workflows/append-link.md
      - Mesh Wrapping: character-dna-addon/workflows/mesh-wrapping.md
      - Customizing Materials: character-dna-addon/workflows/customizing-materials.md
    - Contributing:
      - Development: character-dna-addon/contributing/development.md
      - Documentation: character-dna-addon/contributing/documentation.md
      - Testing: character-dna-addon/contributing/testing.md
  - Character Control Rig Addon:
    - Home: character-control-rig-addon/index.md
    - Getting Started: character-control-rig-addon/getting-started.md
    - Core Concepts: character-control-rig-addon/concepts.md
    - Guides:
      - Adjusting the Metarig: character-control-rig-addon/guides/adjusting-the-metarig.md
      - Export Body Animation: character-control-rig-addon/guides/export-body-animation.md
      - Export Face Board Animation: character-control-rig-addon/guides/export-face-board-animation.md
      - Import FK Animation: character-control-rig-addon/guides/import-body-fk-animation.md
      - Import Face Board Animation: character-control-rig-addon/guides/import-face-board-animation.md
      - Multi-Character Scenes: character-control-rig-addon/guides/multi-character-scenes.md
    - Reference:
      - Operators: character-control-rig-addon/reference/operators.md
      - Properties: character-control-rig-addon/reference/properties.md
      - Bone Mappings: character-control-rig-addon/reference/bone-mappings.md
    - Contributing:
      - Development: character-control-rig-addon/contributing/development.md
  - Character Assembly Addon:
    - Getting Started: character-assembly-addon/index.md
    - Lighting: character-assembly-addon/lighting.md
    - Physics: character-assembly-addon/physics.md
  # END EXTERNAL DOCS

theme:
  name: shadcn
  custom_dir: overrides
  icon: assets/poly-hammer-icon-light.svg
  favicon: assets/favicon.ico
  show_title: true
  topbar_sections: false
  katex_options: {}
  pygments_style:
    light: shadcn-light
    dark: github-dark

hooks:
  - scripts/hooks.py

plugins:
  - search

extra:
  analytics:
    id: !ENV GA_ID

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/theme-icon.js
  - js/particles-init.js
  - js/glowing-cursor.js

markdown_extensions:
  - admonition
  - codehilite
  - fenced_code
  - footnotes
  - attr_list
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.tasklist
  - pymdownx.magiclink
