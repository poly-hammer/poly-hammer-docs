name: Publish documentation
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-main-v1, docs-release-v1]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [staging, production]
        default: staging
      command:
        type: choice
        options: [sync, bootstrap]
        default: sync
      site_commit:
        description: 'Full main SHA: required for bootstrap; optional for production site promotion'
        type: string
        default: ''
concurrency:
  group: docs-publication
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  production:
    if: >-
      vars.DOCS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event.action == 'docs-release-v1' ||
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'production'))
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: production
      command: ${{ inputs.command || 'sync' }}
      site_commit: ${{ inputs.site_commit || '' }}
    secrets: inherit
  staging:
    # Serializing both jobs also prevents state-branch compare-and-swap collisions.
    needs: production
    if: >-
      always() && vars.DOCS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event.action == 'docs-main-v1' || github.event.action == 'docs-release-v1' ||
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'staging'))
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: staging
      command: ${{ inputs.command || 'sync' }}
      site_commit: ${{ inputs.site_commit || '' }}
    secrets: inherit
